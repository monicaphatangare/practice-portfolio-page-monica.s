
<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Monica Sahane</h1>
        <p>Aspiring Web Developer</p>

    <!-- Skills Table -->

        <h2>My Skills</h2>

                <th>Skills</th>

            <tr>

            <label>Name:</label>

            <br><br>

            <label>Email:</label>

            <br><br>

            <label>Message:</label>
            <br>
            <textarea name="message"></textarea>

            <br><br>

            <button type="submit">Submit</button>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Monica Sahane</p>
